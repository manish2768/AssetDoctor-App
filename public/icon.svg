<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#222C40" stroke-width="4" />
  
  <!-- Outer Shield -->
  <path d="M256 64 C340 64, 400 96, 400 96 C400 240, 340 376, 256 432 C172 376, 112 240, 112 96 C112 96, 172 64, 256 64 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" />
  
  <!-- Inner Shield Border -->
  <path d="M256 90 C324 90, 376 116, 376 116 C376 234, 324 348, 256 398 C188 348, 136 234, 136 116 C136 116, 188 90, 256 90 Z" 
        fill="#0B0E14" opacity="0.9" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Medical Cross / Gear Symbol -->
  <g transform="translate(256, 236)">
    <!-- Golden Medical Cross -->
    <rect x="-24" y="-72" width="48" height="144" rx="12" fill="url(#goldGrad)" />
    <rect x="-72" y="-24" width="144" height="48" rx="12" fill="url(#goldGrad)" />
    <!-- Center Emerald Core -->
    <circle cx="0" cy="0" r="28" fill="#10B981" />
    <path d="M-10 -4 L0 8 L14 -8" fill="none" stroke="#0B0E14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
